	<label class="schedule-picker">
		<span class="visually-hidden">Bell schedule</span>
		<select id="schedule-selector" aria-label="Bell schedule" onchange="schedule.setCurrent(this.value)">
			<option value="regular">Monday – Thursday</option>
			<option value="friday">Friday</option>
			<option value="assembly">Cultural Assembly Events</option>
			<option value="earlyRelease">Last Wednesday of Each Month</option>
			<option value="rally">rally 2:30 pm</option>
			<option value="rally2pm">rally 2:00 pm</option>
			<option value="rallyLunch">rally 12:14 pm</option>
			<option value="advisory">advisory 10:23 am</option>
			<option value="noonDismissal">12 Dismissal</option>
		</select>
		<span class="schedule-picker-arrow" aria-hidden="true">&#8964;</span>
	</label>
	<button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
		<svg class="fullscreen-icon fullscreen-icon-enter" viewBox="0 0 24 24" aria-hidden="true">
			<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
		</svg>
		<svg class="fullscreen-icon fullscreen-icon-exit" viewBox="0 0 24 24" aria-hidden="true">
			<path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" />
		</svg>
